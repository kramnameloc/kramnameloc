{% assign minutes = include.post.content | strip_html | number_of_words | plus: 199 | divided_by: 200 | at_least: 1 %}
<p class="entry-meta"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time><span aria-hidden="true">·</span>{{ minutes }} min read</p>
