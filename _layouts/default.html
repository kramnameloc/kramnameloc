<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script>
      try {
        var savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
      } catch (error) {}
    </script>
    <link rel="icon" href="{{ '/assets/images/site-logo.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
    {%- feed_meta -%}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/site-logo.svg' | relative_url }}" alt="" width="30" height="30">
          {{ site.title }}
        </a>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Journal</a>
          <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Archive</a>
          <a href="{{ '/topics/' | relative_url }}"{% if page.url == '/topics/' %} aria-current="page"{% endif %}>Topics</a>
        </nav>
        <div class="header-tools">
          <a class="feed-link" href="{{ '/feed.xml' | relative_url }}" aria-label="RSS feed">{% include icon.html name='rss' %}<span>RSS</span></a>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Dark theme" title="Toggle dark theme" hidden>{% include icon.html name='theme' %}</button>
        </div>
      </div>
    </header>
    <main id="main-content" class="shell" tabindex="-1">{{ content }}</main>
    <footer class="site-footer shell">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
      <nav aria-label="Footer">
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <a href="{{ '/topics/' | relative_url }}">Topics</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a>
      </nav>
    </footer>
    <script>window.siteConfig = { baseUrl: {{ site.baseurl | jsonify }} };</script>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
